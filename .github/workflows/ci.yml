name: Validate and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify code and icon parity
        run: python -m unittest discover -s tests -v

      - name: Generate standalone AHK
        run: python scripts/build.py

      - name: Install pinned official AutoHotkey runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '2.0.30'
          $zip = Join-Path $env:RUNNER_TEMP 'autohotkey.zip'
          $url = "https://github.com/AutoHotkey/AutoHotkey/releases/download/v$version/AutoHotkey_$version.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          # SHA256 published in official release notes for v2.0.30.
          $expected = '1E0ECE7ECB2D5646E55758150472677996A57F9DB5C83D2996D8B47B9E2F31A4'
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "AutoHotkey ZIP checksum mismatch: $actual" }
          $dest = Join-Path $env:RUNNER_TEMP 'autohotkey'
          Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force
          $exe = Get-ChildItem -Path $dest -Filter 'AutoHotkey64.exe' -File -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'AutoHotkey64.exe not found in verified archive' }
          "AHK_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate modular script without executing hooks
        shell: pwsh
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE 'MouseGestures.ahk'
          $errLog = Join-Path $env:RUNNER_TEMP 'ahk-modular-stderr.txt'
          $outLog = Join-Path $env:RUNNER_TEMP 'ahk-modular-stdout.txt'
          $p = Start-Process -FilePath $env:AHK_EXE `
            -ArgumentList "/ErrorStdOut=UTF-8 /Validate `"$script`"" `
            -PassThru -Wait `
            -RedirectStandardError $errLog -RedirectStandardOutput $outLog
          if (Test-Path $outLog) { Get-Content -LiteralPath $outLog -Encoding UTF8 }
          if (Test-Path $errLog) { Get-Content -LiteralPath $errLog -Encoding UTF8 }
          Write-Host "Modular AHK validation exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Modular AHK validation failed (exit code: $($p.ExitCode))" }

      - name: Validate standalone release without executing hooks
        shell: pwsh
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE 'dist\Browser_MouseGestures_v3_8_3_Standalone.ahk'
          $errLog = Join-Path $env:RUNNER_TEMP 'ahk-standalone-stderr.txt'
          $outLog = Join-Path $env:RUNNER_TEMP 'ahk-standalone-stdout.txt'
          $p = Start-Process -FilePath $env:AHK_EXE `
            -ArgumentList "/ErrorStdOut=UTF-8 /Validate `"$script`"" `
            -PassThru -Wait `
            -RedirectStandardError $errLog -RedirectStandardOutput $outLog
          if (Test-Path $outLog) { Get-Content -LiteralPath $outLog -Encoding UTF8 }
          if (Test-Path $errLog) { Get-Content -LiteralPath $errLog -Encoding UTF8 }
          Write-Host "Standalone AHK validation exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Standalone AHK validation failed (exit code: $($p.ExitCode))" }

      - name: Validate AutoHotkey helper test syntax
        shell: pwsh
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE 'tests\gesture_units.ahk'
          $errLog = Join-Path $env:RUNNER_TEMP 'ahk-test-validation-stderr.txt'
          $p = Start-Process -FilePath $env:AHK_EXE `
            -ArgumentList "/ErrorStdOut=UTF-8 /Validate `"$script`"" `
            -PassThru -Wait -RedirectStandardError $errLog
          if (Test-Path $errLog) { Get-Content -LiteralPath $errLog -Encoding UTF8 }
          if ($p.ExitCode -ne 0) { throw "AHK test script failed validation: $($p.ExitCode)" }

      - name: Run safe AutoHotkey helper tests
        shell: pwsh
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE 'tests\gesture_units.ahk'
          $errLog = Join-Path $env:RUNNER_TEMP 'ahk-tests-stderr.txt'
          $outLog = Join-Path $env:RUNNER_TEMP 'ahk-tests-stdout.txt'
          $p = Start-Process -FilePath $env:AHK_EXE `
            -ArgumentList "/ErrorStdOut=UTF-8 /force `"$script`"" `
            -PassThru `
            -RedirectStandardError $errLog -RedirectStandardOutput $outLog
          $finished = $p.WaitForExit(30000)
          if (-not $finished) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            $p.WaitForExit()
          }
          if (Test-Path $outLog) { Get-Content -LiteralPath $outLog -Encoding UTF8 }
          if (Test-Path $errLog) { Get-Content -LiteralPath $errLog -Encoding UTF8 }
          if (-not $finished) { throw 'AHK helper tests timed out after 30 seconds (possible warning/error dialog)' }
          Write-Host "AHK helper test exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "AHK helper tests failed (exit code: $($p.ExitCode))" }

      - name: Upload standalone script
        uses: actions/upload-artifact@v4
        with:
          name: BrowserMouseGestures-v3.8.3-Standalone
          path: dist/Browser_MouseGestures_v3_8_3_Standalone.ahk
