name: Validate and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify code and icon parity
        run: python -m unittest discover -s tests -v

      - name: Generate standalone AHK
        run: python scripts/build.py

      - name: Install pinned official AutoHotkey runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '2.0.30'
          $zip = Join-Path $env:RUNNER_TEMP 'autohotkey.zip'
          $url = "https://github.com/AutoHotkey/AutoHotkey/releases/download/v$version/AutoHotkey_$version.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          # SHA256 published in official release notes for v2.0.30.
          $expected = '1E0ECE7ECB2D5646E55758150472677996A57F9DB5C83D2996D8B47B9E2F31A4'
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "AutoHotkey ZIP checksum mismatch: $actual" }
          $dest = Join-Path $env:RUNNER_TEMP 'autohotkey'
          Expand-Archive -LiteralPath $zip -DestinationPath $dest -Force
          $exe = Get-ChildItem -Path $dest -Filter 'AutoHotkey64.exe' -File -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'AutoHotkey64.exe not found in verified archive' }
          "AHK_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate modular script without executing hooks
        shell: pwsh
        run: |
          & "$env:AHK_EXE" /ErrorStdOut=UTF-8 /Validate "$env:GITHUB_WORKSPACE\MouseGestures.ahk"
          if ($LASTEXITCODE -ne 0) { throw 'Modular entrypoint syntax validation failed' }

      - name: Validate standalone release without executing hooks
        shell: pwsh
        run: |
          & "$env:AHK_EXE" /ErrorStdOut=UTF-8 /Validate "$env:GITHUB_WORKSPACE\dist\Browser_MouseGestures_v3_8_3_Standalone.ahk"
          if ($LASTEXITCODE -ne 0) { throw 'Standalone syntax validation failed' }

      - name: Run safe AutoHotkey helper tests
        shell: pwsh
        run: |
          & "$env:AHK_EXE" /ErrorStdOut=UTF-8 "$env:GITHUB_WORKSPACE\tests\gesture_units.ahk"
          if ($LASTEXITCODE -ne 0) { throw 'AHK helper tests failed' }

      - name: Upload standalone script
        uses: actions/upload-artifact@v4
        with:
          name: BrowserMouseGestures-v3.8.3-Standalone
          path: dist/Browser_MouseGestures_v3_8_3_Standalone.ahk
